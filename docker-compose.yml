services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tailortrack
      POSTGRES_PASSWORD: tailortrack
      POSTGRES_DB: tailortrack
    ports:
      - "5432:5432"
    volumes:
      - tailortrack_pgdata:/var/lib/postgresql/data

volumes:
  tailortrack_pgdata:
