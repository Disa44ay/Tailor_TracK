name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tailortrack
          POSTGRES_PASSWORD: tailortrack
          POSTGRES_DB: tailortrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://tailortrack:tailortrack@localhost:5432/tailortrack_test
      TEST_DATABASE_URL: postgres://tailortrack:tailortrack@localhost:5432/tailortrack_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-real
      CORS_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run database migration (against the CI test database)
        run: node backend/db/migrate.js

      - name: Run backend tests
        run: npm test --workspace=backend

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build --workspace=frontend
