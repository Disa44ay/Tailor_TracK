<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 240" width="1040" height="240" role="img" aria-label="Enquiry status">
<defs>
<marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#241D18"/></marker>
<marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F4B3E"/></marker>
</defs>
<rect width="1040" height="240" fill="#F6F1E8" />
<text x="20" y="44" font-family="'Instrument Serif', Georgia, serif" font-size="30" fill="#241D18">Enquiry status</text>
<text x="20" y="68" font-family="'Instrument Sans', system-ui, sans-serif" font-size="14" fill="#665F59">Any message moves an enquiry into conversation; an accepted date confirms it.</text>
<line x1="210" y1="178" x2="300" y2="178" stroke="#241D18" stroke-width="1.5" marker-end="url(#arrow-ink)" />
<line x1="490" y1="178" x2="580" y2="178" stroke="#2F4B3E" stroke-width="1.5" marker-end="url(#arrow-accent)" />
<line x1="770" y1="178" x2="840" y2="178" stroke="#241D18" stroke-width="1.5" marker-end="url(#arrow-ink)" />
<rect x="40" y="150" width="170" height="56" fill="#F6F1E8" stroke="#241D18" stroke-width="1.5" />
<text x="125" y="183" text-anchor="middle" font-family="'Instrument Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#241D18">sent</text>
<rect x="300" y="150" width="190" height="56" fill="#F6F1E8" stroke="#241D18" stroke-width="1.5" />
<text x="395" y="183" text-anchor="middle" font-family="'Instrument Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#241D18">in_conversation</text>
<rect x="580" y="150" width="190" height="56" fill="#2F4B3E" stroke="#2F4B3E" stroke-width="1.5" />
<text x="675" y="183" text-anchor="middle" font-family="'Instrument Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#F6F1E8">confirmed</text>
<rect x="840" y="150" width="190" height="56" fill="#F6F1E8" stroke="#241D18" stroke-width="1.5" />
<text x="935" y="174" text-anchor="middle" font-family="'Instrument Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#241D18">archived</text>
<text x="935" y="192" text-anchor="middle" font-family="'Instrument Sans', system-ui, sans-serif" font-size="14" font-weight="400" fill="#241D18">after its date</text>
</svg>