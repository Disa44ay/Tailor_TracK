<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>User flow</title>

<rect width="1040" height="520" fill="#F6F1E8" />

<line x1="630" y1="238" x2="670" y2="358" stroke="#241D18" stroke-width="1.5" marker-end="url(#arrow-ink)" />

<rect x="40" y="120" width="170" height="56" fill="#F6F1E8" stroke="#241D18" stroke-width="1.5" />
<text x="125" y="153" text-anchor="middle" font-family="'Instrument Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#241D18">Visit the site</text>

<text x="125" y="372" text-anchor="middle" font-family="'Instrument Sans', system-ui, sans-serif" font-size="14" font-weight="400" fill="#241D18">after its date</text>
